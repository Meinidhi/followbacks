name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build FOLLOWBACK Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Configure preinstalled Android SDK & accept licenses
        run: |
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "Using Android SDK at: $SDK_DIR"
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"

          SDKMANAGER=""
          for candidate in \
            "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" \
            "$SDK_DIR/cmdline-tools/bin/sdkmanager" \
            "$SDK_DIR/tools/bin/sdkmanager"; do
            if [ -x "$candidate" ]; then
              SDKMANAGER="$candidate"
              break
            fi
          done

          if [ -n "$SDKMANAGER" ]; then
            echo "Found sdkmanager: $SDKMANAGER"
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            "$SDKMANAGER" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0" || true
          else
            echo "Warning: sdkmanager not found; relying on Gradle auto-download."
          fi

      - name: Install npm dependencies
        run: npm install --no-audit --no-fund --legacy-peer-deps

      - name: Build web bundle
        run: npm run build

      - name: Ensure Android project exists and sync Capacitor
        run: |
          if [ ! -f "android/gradlew" ]; then
            rm -rf android
            npx cap add android
          fi
          npx cap sync android

      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare APK artifact
        run: cp android/app/build/outputs/apk/debug/app-debug.apk FOLLOWBACK-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FOLLOWBACK-Android-APK
          path: FOLLOWBACK-debug.apk
          retention-days: 30
